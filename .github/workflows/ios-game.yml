name: iOS game build
on:
  workflow_dispatch:
  push:
    paths:
      - 'sys/ios/**'
      - '.github/workflows/ios-game.yml'
concurrency:
  group: ios-game-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate game data and compile engine for iPhone
        run: bash sys/ios/build.sh game
      - name: Launch UIKit app in iPhone simulator
        run: python3 sys/ios/simulate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-screen-verification
          path: build/ios/ios-game-screen.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NetHack-ios-unsigned
          path: build/ios/NetHack-ios-unsigned.ipa
          if-no-files-found: error
